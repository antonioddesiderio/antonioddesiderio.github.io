<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play Tetris | Antonio Desiderio</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    
    <style>
        :root {
            --tetris-bg: #111111;
            --sidebar-bg: #ffffff;
            --accent-red: #E0003C;
        }

        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
        }

        .game-layout {
            display: flex;
            gap: 40px;
            align-items: flex-start;
            max-width: 90vw;
        }

        .canvas-container {
            position: relative;
            background-color: var(--tetris-bg);
            padding: 10px;
            border-radius: 8px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.2);
            border: 4px solid #222;
        }

        canvas#tetris {
            display: block;
            background-color: #000;
        }

        .sidebar {
            width: 300px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .stat-box {
            background: #f9f9f9;
            padding: 20px;
            border-radius: 8px;
            border-left: 4px solid var(--accent-red);
        }

        .stat-label {
            font-family: 'Space Mono', monospace;
            font-size: 0.75rem;
            text-transform: uppercase;
            color: #888;
            letter-spacing: 1px;
            display: block;
            margin-bottom: 5px;
        }

        .stat-value {
            font-family: 'Space Mono', monospace;
            font-size: 1.5rem;
            font-weight: 700;
            color: #111;
        }

        .next-piece-container {
            background: #111;
            padding: 15px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 2px solid #222;
        }

        .next-piece-container span {
            color: #555;
            font-family: 'Space Mono', monospace;
            font-size: 0.7rem;
            margin-bottom: 10px;
        }

        .tony-quote {
            font-style: italic;
            color: #666;
            line-height: 1.6;
            font-size: 1.1rem;
            margin-top: 20px;
            padding: 20px;
            background: rgba(224, 0, 60, 0.05);
            border-radius: 12px;
            position: relative;
        }

        .tony-quote::before {
            content: '"';
            position: absolute;
            top: 10px;
            left: 10px;
            font-size: 3rem;
            color: rgba(224, 0, 60, 0.1);
            font-family: serif;
        }

        .back-nav {
            position: absolute;
            top: 40px;
            left: 40px;
            font-family: 'Space Mono', monospace;
            text-transform: uppercase;
        }

        .back-nav a {
            text-decoration: none;
            color: #111;
            font-weight: 700;
            padding: 12px 24px;
            border: 2px solid #111;
            transition: all 0.3s ease;
            font-size: 0.9rem;
            letter-spacing: 1px;
        }

        .back-nav a:hover {
            background-color: #111;
            color: #fff;
        }

        .controls-hint {
            font-family: 'Space Mono', monospace;
            font-size: 0.8rem;
            color: #999;
            margin-top: auto;
        }

        .controls-hint strong {
            color: #444;
        }

        @media (max-width: 800px) {
            .game-layout {
                flex-direction: column;
                align-items: center;
                overflow-y: auto;
                max-height: 90vh;
                padding-top: 80px;
            }
            .sidebar {
                width: 100%;
                max-width: 320px;
            }
            .back-nav {
                top: 20px;
                left: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="back-nav">
        <a href="index.html">← Back to Site</a>
    </div>

    <div class="game-layout">
        <div class="canvas-container">
            <canvas id="tetris" width="300" height="600"></canvas>
        </div>

        <div class="sidebar">
            <div class="stat-box">
                <span class="stat-label">Score</span>
                <div id="score" class="stat-value">0</div>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                <div class="stat-box">
                    <span class="stat-label">Level</span>
                    <div id="level" class="stat-value">1</div>
                </div>
                <div class="stat-box">
                    <span class="stat-label">Lines</span>
                    <div id="lines" class="stat-value">0</div>
                </div>
            </div>

            <div class="next-piece-container">
                <span>NEXT PIECE</span>
                <canvas id="next" width="100" height="100"></canvas>
            </div>

            <div class="tony-quote">
                Tony needs to play videogames by times to times during the day...
            </div>

            <div class="controls-hint">
                <strong>ARROWS</strong> to move & rotate<br>
                <strong>SPACE</strong> for hard drop<br>
                <strong>P</strong> to pause | <strong>R</strong> to restart
            </div>
        </div>
    </div>

    <script type="module">
        import { Tetris } from './js/tetris.js';

        document.addEventListener('DOMContentLoaded', () => {
            const game = new Tetris('tetris', 'next', 'score', 'level', 'lines');
            game.start();

            window.addEventListener('keydown', (e) => {
                if (e.key === 'r' || e.key === 'R') {
                    game.reset();
                    game.drawNext();
                }
            });
        });
    </script>
</body>
</html>
