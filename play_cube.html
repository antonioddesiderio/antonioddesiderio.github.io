<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play with the Cube</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@300;400;500;600;700&family=Red+Hat+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    
    <!-- Three.js CDN -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <style>
        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            flex-direction: column;
            font-family: var(--font-mono);
            font-variation-settings: var(--font-settings-mono);
            color: var(--text-primary);
        }
        #cube-container-play {
            width: min(700px, 90vw);
            height: min(700px, 80vh);
            z-index: 1;
        }
        .back-nav {
            position: absolute;
            top: var(--space-xl);
            left: var(--space-xl);
            font-family: var(--font-mono);
            text-transform: uppercase;
            z-index: 10;
        }
        .back-nav a {
            text-decoration: none;
            color: var(--text-primary);
            padding: var(--space-xs) var(--space-lg);
            border: 1px solid rgba(0, 0, 0, 0.1);
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(4px);
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            font-size: var(--step--1);
            display: inline-block;
            font-weight: 600;
        }
        .back-nav a:hover {
            background-color: var(--accent-color);
            color: white;
            border-color: var(--accent-color);
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
        }
        .instructions {
            position: absolute;
            bottom: var(--space-3xl);
            font-family: var(--font-mono);
            font-variation-settings: var(--font-settings-mono);
            color: var(--text-secondary);
            text-align: center;
            line-height: 1.8;
            font-size: var(--step-0);
            z-index: 10;
            pointer-events: none;
            padding: 0 var(--space-lg);
            text-wrap: balance;
        }
        .instructions strong {
            color: var(--text-primary);
            font-family: var(--font-mono);
            text-transform: uppercase;
            font-size: var(--step--1);
            letter-spacing: 0.05em;
        }
    </style>
</head>
<body>
    <canvas id="particles-canvas"></canvas>

    <div class="back-nav">
        <a href="play.html">← Back to Playground</a>
    </div>

    <div id="cube-container-play"></div>
    
    <div class="instructions">
        <strong>Drag on a piece</strong> to rotate a layer<br>
        <strong>Drag outside</strong> to rotate the camera
    </div>

    <script type="module">
        import { RubiksCube } from './js/cube.js';
        import { ParticleNetwork } from './js/particles-bg.js';
        
        document.addEventListener('DOMContentLoaded', () => {
            // Particle Background
            if (window.innerWidth > 768) {
                window.particleBg = new ParticleNetwork('particles-canvas');
            }
            const cube = new RubiksCube('cube-container-play', true);
            // Always start with a random configuration on this page
            cube.scramble(30); 
        });
    </script>
</body>
</html>
