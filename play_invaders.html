<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play Space Invaders | Antonio Desiderio</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="style.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background-color: transparent; /* Allows particles to show */
        }

        #game-container {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #111;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            border: 2px solid #222;
        }

        canvas#invadersCanvas {
            background-color: #000;
            display: block;
            border-radius: 4px;
        }

        .back-nav {
            position: absolute;
            top: 40px;
            left: 40px;
            font-family: 'Space Mono', monospace;
            text-transform: uppercase;
            z-index: 20;
        }

        .back-nav a {
            text-decoration: none;
            color: #111;
            font-weight: 700;
            padding: 12px 24px;
            border: 2px solid #111;
            transition: all 0.3s ease;
            font-size: 0.9rem;
            letter-spacing: 1px;
            background-color: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(5px);
        }

        .back-nav a:hover {
            background-color: #111;
            color: #fff;
        }

        #game-over-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: rgba(0, 0, 0, 0.8);
            color: #fff;
            font-family: 'Space Mono', monospace;
            z-index: 15;
            border-radius: 12px;
        }

        #game-over-screen h2 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            color: #E0003C;
        }

        #game-over-screen button {
            padding: 10px 20px;
            font-size: 1.2rem;
            font-family: 'Space Mono', monospace;
            background-color: #23BC3F;
            color: #fff;
            border: none;
            cursor: pointer;
            border-radius: 4px;
            text-transform: uppercase;
            transition: background-color 0.3s;
        }

        #game-over-screen button:hover {
            background-color: #0051BA;
        }
    </style>
</head>

<body>
    <canvas id="particles-canvas"></canvas>

    <div class="back-nav">
        <a href="play.html">← Back to Games</a>
    </div>

    <div id="game-container">
        <canvas id="invadersCanvas" width="600" height="600"></canvas>
        <div id="game-over-screen">
            <h2>GAME OVER</h2>
            <p>Score: <span id="final-score">0</span></p>
            <button id="restart-btn">Try Again</button>
        </div>
    </div>

    <script type="module">
        import { ParticleNetwork } from './js/particles-bg.js';
        
        document.addEventListener('DOMContentLoaded', () => {
            // Background particles
            if (window.innerWidth > 768) {
                window.particleBg = new ParticleNetwork('particles-canvas');
            }
        });
    </script>
    <script type="module" src="./js/invaders.js"></script>
</body>

</html>
