<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play Space Invaders | Antonio Desiderio</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@300;400;500;600;700&family=Red+Hat+Mono:wght@400;500;600&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="style.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background-color: var(--bg-color);
            font-family: var(--font-body);
            font-variation-settings: var(--font-settings-body);
            color: var(--text-primary);
        }

        #game-container {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #111;
            padding: var(--space-lg);
            border-radius: var(--rounded-md, 12px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        canvas#invadersCanvas {
            background-color: #000;
            display: block;
            border-radius: 4px;
            max-width: 90vw;
            max-height: 70vh;
        }

        .back-nav {
            position: absolute;
            top: var(--space-xl);
            left: var(--space-xl);
            font-family: var(--font-mono);
            font-variation-settings: var(--font-settings-mono);
            text-transform: uppercase;
            z-index: 20;
        }

        .back-nav a {
            text-decoration: none;
            color: var(--text-primary);
            padding: var(--space-xs) var(--space-lg);
            border: 1px solid rgba(0, 0, 0, 0.1);
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(4px);
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            font-size: var(--step--1);
            display: inline-block;
            font-weight: 600;
        }

        .back-nav a:hover {
            background-color: var(--accent-color);
            color: white;
            border-color: var(--accent-color);
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
        }

        #game-over-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: rgba(0, 0, 0, 0.85);
            color: #fff;
            font-family: var(--font-mono);
            font-variation-settings: var(--font-settings-mono);
            z-index: 15;
            border-radius: var(--rounded-md, 12px);
            backdrop-filter: blur(4px);
        }

        #game-over-screen h2 {
            font-size: var(--step-3);
            margin-bottom: var(--space-md);
            color: var(--accent-color);
            letter-spacing: 0.1em;
        }

        #game-over-screen p {
            font-size: var(--step-1);
            margin-bottom: var(--space-xl);
        }

        #game-over-screen button {
            padding: var(--space-xs) var(--space-2xl);
            font-size: var(--step--1);
            font-family: var(--font-mono);
            font-variation-settings: var(--font-settings-mono);
            background-color: transparent;
            color: #fff;
            border: 2px solid #fff;
            cursor: pointer;
            border-radius: 30px;
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 0.05em;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        #game-over-screen button:hover {
            background-color: #fff;
            color: #000;
            transform: scale(1.05);
        }
    </style>
</head>

<body>
    <canvas id="particles-canvas"></canvas>

    <div class="back-nav">
        <a href="play.html">← Back to Playground</a>
    </div>

    <div id="game-container">
        <canvas id="invadersCanvas" width="600" height="600"></canvas>
        <div id="game-over-screen">
            <h2>GAME OVER</h2>
            <p>Score: <span id="final-score">0</span></p>
            <button id="restart-btn">Try Again</button>
        </div>
    </div>

    <script type="module">
        import { ParticleNetwork } from './js/particles-bg.js';
        
        document.addEventListener('DOMContentLoaded', () => {
            // Background particles
            if (window.innerWidth > 768) {
                window.particleBg = new ParticleNetwork('particles-canvas');
            }
        });
    </script>
    <script type="module" src="./js/invaders.js"></script>
</body>

</html>
